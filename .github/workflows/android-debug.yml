name: Build Turkish LabNex APKs

on:
  workflow_dispatch:
  push:
    branches: [main, feat/turkish-localization]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Configure Android SDK from GitHub runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> "$GITHUB_PATH"
          test -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK 36
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build free and premium debug APKs
        run: ./gradlew --no-daemon :app:assembleFreeDebug :app:assemblePremiumDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: LabNex-Turkish-debug-APKs
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
